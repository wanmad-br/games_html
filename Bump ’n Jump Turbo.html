<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bump ’n Jump Turbo</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1a12;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:'Chakra Petch',system-ui,sans-serif}
#wrap{height:100%;display:flex;justify-content:center;align-items:center}
#g{position:relative;width:min(100vw,calc(100dvh*9/16));height:min(100dvh,calc(100vw*16/9));container-type:size;background:#111}
canvas{width:100%;height:100%;display:block}
.b{position:absolute;bottom:5cqw;width:20cqw;height:20cqw;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.14);color:#fff;font:700 8cqw 'Chakra Petch',system-ui,sans-serif;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none;padding:0}
.b:active{background:rgba(255,255,255,.3)}
#L{left:4cqw}#R{left:26cqw}
#J{right:4cqw;width:26cqw;height:26cqw;font-size:6cqw;background:rgba(255,122,26,.55);border-color:#ffd9b8}
</style>
</head>
<body>
<div id="wrap"><div id="g">
<canvas id="cv" width="720" height="1280"></canvas>
<button class="b" id="L" aria-label="Esquerda">◀</button>
<button class="b" id="R" aria-label="Direita">▶</button>
<button class="b" id="J" aria-label="Pular">PULAR</button>
</div></div>
<script>
const cv=document.getElementById('cv'),c=cv.getContext('2d'),W=360,H=640,PY=470;
c.scale(2,2);
const keys={l:0,r:0};
let st='title',d=0,spd=3,lives=3,bonus=0,score=0,best=0,P,E=[],parts=[],inv=0,shake=0,t=0,nextSpawn=0,endT=0;
try{best=+localStorage.getItem('bj_best')||0}catch(e){}
const COLS=['#2a9df4','#f2c14e','#9b5de5','#e63946','#2ec4b6','#e9e6da'];
const roadC=y=>W/2+Math.sin(y/520)*46+Math.sin(y/190)*14;
const roadW=y=>200+Math.sin(y/900)*20;
const isGap=y=>{if(y<1400)return false;const m=((y%1800)+1800)%1800;return m>1500&&m<1590};
const rnd=n=>{const r=Math.sin(n*127.1)*43758.5453;return r-Math.floor(r)};

let ac;
function beep(f,l){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+l);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+l)}catch(e){}}

function reset(){d=0;spd=3;lives=3;bonus=0;score=0;E=[];parts=[];inv=0;shake=0;nextSpawn=300;P={x:W/2,vx:0,z:0,vz:0}}
function start(){reset();st='play'}
reset();

function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*3.5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:30+Math.random()*20,m:50,c:col,r:2+Math.random()*3})}}

function jump(){
  if(st!=='play'){if(Date.now()-endT>500)start();return}
  if(P.z===0){P.vz=7.5;P.z=.01;beep(330,.12)}
}
function die(){
  if(inv>0)return;
  lives--;burst(P.x,PY,'#ff9d3c',26);burst(P.x,PY,'#79c7ff',16);beep(90,.45);shake=22;
  if(lives<=0){st='over';endT=Date.now();if(score>best){best=score;try{localStorage.setItem('bj_best',best)}catch(e){}}return}
  while(isGap(d)||isGap(d+60)||isGap(d-60))d+=15;
  P.x=roadC(d);P.vx=0;P.z=0;P.vz=0;E=[];inv=130;spd=2.6;nextSpawn=250;
}

function update(){
  t++;shake*=.88;if(inv>0)inv--;
  for(const p of parts){p.x+=p.vx;p.y+=p.vy+spd*.4;p.vy+=.12;p.l--}
  parts=parts.filter(p=>p.l>0);
  if(st!=='play'){d+=2;return}
  const base=Math.min(3.4+d/8000,6.6);spd+=(base-spd)*.02;
  let sp=spd;
  P.vx+=(keys.r-keys.l)*.6;P.vx*=.85;P.x+=P.vx;
  let land=false;
  if(P.z>0){P.vz-=.36;P.z+=P.vz;if(P.z<=0){P.z=0;P.vz=0;land=true;beep(120,.08)}}
  const rc=roadC(d),rw=roadW(d)/2,off=Math.abs(P.x-rc)-rw;
  if(off>0&&P.z<=0)sp*=Math.max(.45,1-off/70);
  if(off>44&&P.z<=0){die();return}
  if(isGap(d)&&P.z<=0){die();return}
  nextSpawn-=sp;
  if(nextSpawn<0){
    nextSpawn=110+Math.random()*150;
    const wy=d+PY+60;
    if(!isGap(wy)&&!isGap(wy-60)){
      const lane=(Math.random()*2-1)*(roadW(wy)/2-28);
      E.push({wy,x:roadC(wy)+lane,vx:0,sp:1.6+Math.random()*1.7,col:COLS[Math.floor(Math.random()*COLS.length)],dead:0});
    }
  }
  for(const e of E){
    const pc=roadC(e.wy);e.wy+=e.sp;e.x+=roadC(e.wy)-pc;
    const ey=PY-(e.wy-d);
    if(e.dead){e.dead++;continue}
    e.x+=e.vx;e.vx*=.93;
    const er=Math.abs(e.x-roadC(e.wy))-roadW(e.wy)/2;
    if(er>16||isGap(e.wy)){e.dead=1;bonus+=100;burst(e.x,ey,'#79c7ff',18);beep(240,.15);continue}
    const dx=e.x-P.x,dy=ey-PY;
    if(Math.abs(dx)<31&&Math.abs(dy)<46&&P.z<14){
      const dir=dx>=0?1:-1;
      if(land){bonus+=50;e.vx=dir*5.5;burst(e.x,ey,'#ffd23f',14);beep(520,.1)}
      else if(P.z<=0){
        e.vx=Math.max(-5.5,Math.min(5.5,e.vx+dir*.9));P.vx-=dir*.5;shake=Math.max(shake,4);
        if(dy<-20&&Math.abs(dx)<24)sp=Math.min(sp,e.sp+.4);
      }
    }
  }
  E=E.filter(e=>e.dead<40&&PY-(e.wy-d)<H+90);
  d+=sp;score=Math.floor(d/10)+bonus;
}

function tx(s,x,y,size,col,al){c.font=`700 ${size}px 'Chakra Petch',system-ui,sans-serif`;c.textAlign=al||'center';c.lineWidth=size/5;c.strokeStyle='rgba(8,16,12,.85)';c.lineJoin='round';c.strokeText(s,x,y);c.fillStyle=col;c.fillText(s,x,y)}

function tree(x,y,r){
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(x+6,y+r*.7,r,r*.7,0,0,7);c.fill();
  c.fillStyle='#5b3a24';c.fillRect(x-2,y-2,4,r*.5);
  const g=c.createRadialGradient(x-r*.3,y-r*.4,2,x,y-r*.2,r*1.1);g.addColorStop(0,'#6fdc8a');g.addColorStop(1,'#1d6a3a');
  c.fillStyle=g;c.beginPath();c.arc(x,y-r*.3,r,0,7);c.fill();
}

function car(x,y,z,col,pl,tilt,al){
  c.save();c.globalAlpha=al;
  c.fillStyle='rgba(0,0,0,.33)';c.beginPath();c.ellipse(x+3+z*.2,y+6+z*.5,18,31,0,0,7);c.fill();
  c.translate(x,y-z);c.rotate(tilt);const s=1+z/110;c.scale(s,s);
  if(pl){c.fillStyle='rgba(255,243,176,.13)';c.beginPath();c.moveTo(-10,-29);c.lineTo(-30,-120);c.lineTo(30,-120);c.lineTo(10,-29);c.fill()}
  c.fillStyle='#14161c';[[-19,-19],[14,-19],[-19,13],[14,13]].forEach(w=>{c.beginPath();c.roundRect(w[0],w[1],5,14,2);c.fill()});
  c.fillStyle=col;c.beginPath();c.roundRect(-16,-29,32,58,11);c.fill();
  if(pl){c.fillStyle='#f4f1e6';c.fillRect(-3,-29,6,58)}
  const g=c.createLinearGradient(-16,0,16,0);g.addColorStop(0,'rgba(0,0,0,.35)');g.addColorStop(.5,'rgba(255,255,255,.2)');g.addColorStop(1,'rgba(0,0,0,.45)');
  c.fillStyle=g;c.fill();
  c.fillStyle='#1b2a41';c.beginPath();c.roundRect(-12,-12,24,13,4);c.fill();c.beginPath();c.roundRect(-12,9,24,9,3);c.fill();
  c.fillStyle='rgba(255,255,255,.3)';c.fillRect(-9,-10,8,3);
  c.fillStyle='#fff3b0';c.fillRect(-13,-29,7,3);c.fillRect(6,-29,7,3);
  c.fillStyle='#ff3b3b';c.fillRect(-13,26,7,3);c.fillRect(6,26,7,3);
  c.restore();
}

function draw(){
  c.save();
  if(shake>.5)c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  for(let y=-8;y<H+8;y+=4){
    const wy=d+PY-y,cx=roadC(wy),rw=roadW(wy)/2;
    c.fillStyle=(Math.floor(wy/40)&1)?'#2f9150':'#2a8648';c.fillRect(0,y,W,4);
    if(isGap(wy)){c.fillStyle=Math.sin((wy+t*2)/9)>.55?'#4aa3e8':'#2f80d0';c.fillRect(0,y,W,4);continue}
    c.fillStyle='#e2cd90';c.fillRect(cx-rw-38,y,2*rw+76,4);
    c.fillStyle=(Math.floor(wy/24)&1)?'#e8384f':'#f4f1e6';c.fillRect(cx-rw-10,y,2*rw+20,4);
    c.fillStyle='#394150';c.fillRect(cx-rw,y,2*rw,4);
    if(Math.floor(wy/60)%2===0){c.fillStyle='rgba(255,255,255,.55)';c.fillRect(cx-rw/3-1.5,y,3,4);c.fillRect(cx+rw/3-1.5,y,3,4)}
  }
  for(let k=Math.floor((d-60)/90);k<=Math.floor((d+PY+80)/90);k++){
    const wy=k*90;if(isGap(wy)||isGap(wy+30)||isGap(wy-30))continue;
    const y=PY-(wy-d),cx=roadC(wy),rw=roadW(wy)/2;
    [-1,1].forEach(s=>{const h=rnd(k*2+(s>0?1:0));if(h<.25)return;tree(cx+s*(rw+64+rnd(k*7+s)*70),y,15+h*9)});
  }
  for(const e of E){
    const ey=PY-(e.wy-d);
    if(e.dead){c.save();c.translate(e.x,ey);c.scale(1-e.dead/70,1-e.dead/70);car(0,0,0,e.col,0,e.vx*.05,1-e.dead/40);c.restore()}
    else car(e.x,ey,0,e.col,0,e.vx*.05,1);
  }
  if(st!=='over'&&!(inv>0&&(t>>2)&1))car(P.x,PY,P.z,'#ff7a1a',1,P.vx*.05,1);
  for(const p of parts){c.globalAlpha=p.l/p.m;c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill()}
  c.globalAlpha=1;
  const vg=c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.78);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,10,5,.4)');
  c.fillStyle=vg;c.fillRect(0,0,W,H);
  c.restore();
  if(st==='play'){
    let warn=false;for(let k=4;k<=18;k++)if(isGap(d+k*22)){warn=true;break}
    if(warn&&P.z<=0&&(t>>3)&1)tx('PULE O RIO!',W/2,110,26,'#ffd23f');
    tx(String(score),16,38,28,'#fff','left');
    tx('recorde '+best,16,58,13,'#cfe8d6','left');
    for(let i=0;i<lives;i++){c.save();c.translate(W-24-i*22,30);c.scale(.4,.4);car(0,0,0,'#ff7a1a',1,0,1);c.restore()}
  }else{
    c.fillStyle='rgba(6,14,10,.62)';c.fillRect(0,0,W,H);
    if(st==='title'){
      tx('BUMP ’N',W/2,190,58,'#ff7a1a');tx('JUMP',W/2,252,58,'#ffd23f');
      tx('TURBO',W/2,290,22,'#79c7ff');
      tx('Empurre os carros para fora da pista.',W/2,350,15,'#e9f3ec');
      tx('Pule rios e pule em cima dos rivais.',W/2,374,15,'#e9f3ec');
    }else{
      tx('Fim de jogo',W/2,220,40,'#ff7a1a');
      tx(score+' pontos',W/2,272,28,'#fff');
      tx(score>=best&&score>0?'Novo recorde!':'Recorde: '+best,W/2,308,18,'#ffd23f');
    }
    if((t>>5)&1)tx(st==='title'?'Toque para jogar':'Toque para jogar de novo',W/2,420,20,'#fff');
  }
}

let last=performance.now(),acc=0;
function loop(ts){acc+=Math.min(ts-last,50);last=ts;while(acc>=16.67){update();acc-=16.67}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function hold(id,k){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;try{b.setPointerCapture(e.pointerId)}catch(_){}if(st!=='play')jump()});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=0}));
}
hold('L','l');hold('R','r');
document.getElementById('J').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(st!=='play')jump()});
document.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.l=1;
  if(e.key==='ArrowRight'||e.key==='d')keys.r=1;
  if(e.key===' '||e.key==='ArrowUp'||e.key==='Enter'){e.preventDefault();jump()}
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.l=0;
  if(e.key==='ArrowRight'||e.key==='d')keys.r=0;
});
</script>
</body>
</html>
