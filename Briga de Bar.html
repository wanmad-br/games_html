const bg=document.createElement('canvas');bg.width=W*2;bg.height=H*2;
(function(){const g=bg.getContext('2d');g.scale(2,2);
g.fillStyle='#7a3030';g.fillRect(0,0,W,400);g.strokeStyle='#5c2020';g.lineWidth=2;
for(let r=0;r<13;r++){const y=r*20;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();for(let x=(r%2)*22;x<W;x+=44){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+20);g.stroke()}}
g.fillStyle='#4a2418';g.fillRect(0,270,W,130);g.strokeStyle='#33180f';for(let x=0;x<W;x+=50)g.strokeRect(x+5,282,40,100);
g.fillStyle='#6b3a22';g.fillRect(0,264,W,10);
g.lineWidth=3;g.strokeStyle='#1a1018';

[[140,0],[205,2]].forEach(([y,o])=>{g.fillStyle='#3a1c10';g.fillRect(30,y,W-60,8);g.strokeRect(30,y,W-60,8);
for(let i=0,x=48;x<W-50;x+=27,i++){g.fillStyle=cols[(i+o)%6];const h=30+(i*7%3)*6;g.beginPath();g.roundRect(x,y-h,14,h,4);g.fill();g.stroke();g.fillRect(x+4,y-h-12,6,12);g.strokeRect(x+4,y-h-12,6,12)}});
g.shadowColor='#ff3b9a';g.shadowBlur=20;g.strokeStyle='#ff6ec0';g.lineWidth=4;g.beginPath();g.roundRect(95,24,260,62,16);g.stroke();
g.fillStyle='#ffd1ec';g.font='bold 38px Impact,sans-serif';g.textAlign='center';g.fillText('BAR DO ZÉ',225,68);g.shadowBlur=0;
g.lineWidth=3;g.strokeStyle='#1a1018';
g.fillStyle='#8a4b22';g.fillRect(0,336,W,64);for(let x=0;x<W;x+=75){g.strokeRect(x+6,346,63,44)}
g.fillStyle='#c98a4b';g.fillRect(0,322,W,14);g.strokeRect(-2,322,W+4,14);
g.fillStyle='#d9b24a';g.fillRect(0,392,W,6);
[60,200,330].forEach(x=>{g.fillStyle='#f2b632';g.beginPath();g.roundRect(x,300,18,22,4);g.fill();g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(x+9,300,9,0,7);g.fill();g.stroke()});
[70,225,380].forEach(x=>{g.fillStyle='#444';g.fillRect(x-4,398,8,30);g.beginPath();g.ellipse(x,430,22,6,0,0,7);g.fill();g.stroke();g.fillStyle='#b3212b';g.beginPath();g.ellipse(x,396,28,9,0,0,7);g.fill();g.stroke()});
const fl=g.createLinearGradient(0,400,0,H);fl.addColorStop(0,'#8f5a30');fl.addColorStop(1,'#b97d47');g.fillStyle=fl;g.fillRect(0,400,W,400);
g.strokeStyle='rgba(40,20,10,.45)';g.lineWidth=2;
for(let i=0;i<10;i++){const y=400+i*i*4.6+i*6;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
for(let k=-7;k<=7;k++){g.beginPath();g.moveTo(W/2+k*30,400);g.lineTo(W/2+k*100,H);g.stroke()}
g.strokeStyle='#1a1018';g.lineWidth=4;g.beginPath();g.moveTo(0,400);g.lineTo(W,400);g.stroke();
const v=g.createRadialGradient(W/2,560,200,W/2,560,520);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');g.fillStyle=v;g.fillRect(0,0,W,H);
})();
// ---------- desenho dos personagens
function rr(x,y,w,h,r,f){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=f;ctx.fill();ctx.stroke()}
function circ(x,y,r,f){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=f;ctx.fill();ctx.stroke()}
function arm(x1,y1,x2,y2,sk,r){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineWidth=14;ctx.strokeStyle='#1a1018';ctx.stroke();ctx.lineWidth=7;ctx.strokeStyle=sk;ctx.stroke();ctx.lineWidth=3.5;ctx.strokeStyle='#1a1018';circ(x2,y2,r,sk)}
function drawChar(o){
const C=o.flash>0?{skin:'#fff',shirt:'#fff',pants:'#fff',hair:'#fff'}:o;
ctx.save();ctx.translate(o.x,o.y);
ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,0,30*o.s,9*o.s,0,0,7);ctx.fill();
ctx.globalAlpha=o.alpha===undefined?1:o.alpha;ctx.scale(o.s*o.face,o.s);
ctx.lineWidth=3.5;ctx.strokeStyle='#1a1018';ctx.lineJoin=ctx.lineCap='round';
if(o.rot){ctx.translate(0,-50);ctx.rotate(o.rot);ctx.translate(0,50)}
const w=o.moving?Math.sin(o.anim*14):0,bob=o.moving?-Math.abs(w)*4:Math.sin(o.anim*3)*1.5;
const k=o.at?Math.sin(Math.PI*o.ap):0,kick=o.at=='kick',pun=o.at=='punch';
arm(-14,-68+bob,-24,-46+bob-w*3,C.skin,8);
rr(-17+w*7,-34,14,34,6,C.pants);rr(-19+w*7,-8,20,9,4,'#222');
if(kick){ctx.save();ctx.translate(8,-32);ctx.rotate(-1.35*k);rr(-7,0,14,38,6,C.pants);rr(-9,30,22,9,4,'#222');ctx.restore()}
else{rr(3-w*7,-34,14,34,6,C.pants);rr(1-w*7,-8,20,9,4,'#222')}
rr(-19,-78+bob,38,48,15,C.shirt);rr(-19,-40+bob,38,8,3,'#3b2a1a');
ctx.save();ctx.translate(0,bob+(kick?-3:0));
circ(0,-98,25,C.skin);
ctx.fillStyle=C.hair;
if(o.style==0){ctx.beginPath();ctx.moveTo(-24,-100);[[-24,-124],[-14,-112],[-8,-134],[0,-114],[8,-138],[14,-114],[24,-128],[25,-100]].forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.stroke()}
else if(o.style==1){ctx.beginPath();ctx.arc(0,-100,26,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();rr(-26,-110,52,10,4,o.flash>0?'#fff':'#c0392b')}
else if(o.style==2){ctx.beginPath();ctx.moveTo(-14,-118);[[-8,-142],[-2,-120],[4,-146],[10,-120],[16,-140],[20,-114]].forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.stroke()}
circ(25,-95,5,o.flash>0?'#fff':'#00000022');
const xx=o.hu;
for(const ex of[7,19]){if(xx){ctx.beginPath();ctx.moveTo(ex-4,-106);ctx.lineTo(ex+4,-98);ctx.moveTo(ex+4,-106);ctx.lineTo(ex-4,-98);ctx.stroke()}
else{ctx.beginPath();ctx.ellipse(ex,-102,6,7.5,0,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ex+2,-101,3,0,7);ctx.fill()}}
if(!xx){ctx.lineWidth=4;ctx.beginPath();if(o.enemy){ctx.moveTo(0,-113);ctx.lineTo(12,-108);ctx.moveTo(27,-113);ctx.lineTo(15,-108)}else{ctx.moveTo(1,-111);ctx.lineTo(12,-112);ctx.moveTo(26,-111);ctx.lineTo(15,-113)}ctx.stroke();ctx.lineWidth=3.5}
ctx.beginPath();
if(xx||o.at||o.wind){ctx.ellipse(15,-86,5,6,0,0,7);ctx.fillStyle='#7a1010';ctx.fill();ctx.stroke()}
else{ctx.moveTo(9,-84);ctx.quadraticCurveTo(15,o.enemy?-90:-79,21,-84);ctx.stroke()}
if(o.style==3){ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(18,-92,10,4,0,0,7);ctx.fill()}
ctx.restore();
let fx=22+w*3,fy=-46+bob,fr=8;
if(pun){fx=22+44*k;fy=-46-14*k+bob;fr=8+3*k}else if(kick){fx=18;fy=-60+bob}else if(o.wind){fx=-16;fy=-96+bob+Math.sin(o.anim*30)*2;fr=10}else if(o.hu){fx=-26;fy=-80}
arm(14,-68+bob,fx,fy,C.skin,fr);
if(o.st=='stun'){ctx.font='bold 16px sans-serif';ctx.fillStyle='#ffd23f';for(let i=0;i<3;i++)ctx.fillText('★',Math.cos(o.anim*6+i*2.1)*24-6,-132+Math.sin(o.anim*6+i*2.1)*5)}
ctx.restore();
if(o.enemy&&o.st!='dead'&&o.hp<o.max){ctx.fillStyle='#000';ctx.fillRect(o.x-20*o.s,o.y-143*o.s,40*o.s,6);ctx.fillStyle='#ff4a3d';ctx.fillRect(o.x-19*o.s,o.y-142*o.s,38*o.s*o.hp/o.max,4)}
}
// ---------- estado
const T={thug:{hp:4,sp:72,dmg:10,b:1,skin:'#f2c28b',shirt:'#d63c3c',pants:'#3d4a8a',hair:'#444',style:1},
fast:{hp:3,sp:125,dmg:8,b:.88,skin:'#e9b17a',shirt:'#3fae5a',pants:'#2b2b3a',hair:'#e91e8c',style:2},
brute:{hp:10,sp:50,dmg:20,b:1.28,skin:'#d9a07a',shirt:'#8b4fc4',pants:'#5a3a22',hair:'#000',style:3}};
let mode='menu',P,E=[],FX=[],PT=[],IT=[],wave=0,toSpawn=0,spawned=0,spawnT=0,banner=0,score=0,combo=0,comboT=0,shake=0,lockUntil=0;
const ptr={down:false,x:225,y:600,sp:0,lx:0,ly:0,lt:0};
function pp(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
[ptr.x,ptr.y]=pp(e);ptr.lx=ptr.x;ptr.ly=ptr.y;ptr.lt=e.timeStamp;ptr.sp=0;ptr.down=true;
if(mode!='play'&&performance.now()>lockUntil)start()});
cv.addEventListener('pointermove',e=>{if(!ptr.down)return;const[x,y]=pp(e),dt=Math.max(8,e.timeStamp-ptr.lt);
ptr.sp=Math.max(ptr.sp,Math.hypot(x-ptr.lx,y-ptr.ly)/dt*1000);ptr.x=x;ptr.y=y;ptr.lx=x;ptr.ly=y;ptr.lt=e.timeStamp});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>ptr.down=false));
function start(){P={x:225,y:620,base:1,s:1,face:1,hp:100,max:100,anim:0,cd:0,inv:0,flash:0,hurt:0,vx:0,atk:null,pw:0,tgt:null,skin:'#ffd1a0',shirt:'#ffd23f',pants:'#2457c5',hair:'#ff7a1a',style:0,st:'walk'};
E=[];FX=[];PT=[];IT=[];wave=0;score=0;combo=0;nextWave();mode='play'}
function nextWave(){wave++;toSpawn=4+wave*3;spawned=0;spawnT=.5;banner=2}
function spawn(){const r=Math.random(),k=wave>=2&&r<.12+wave*.03?'brute':wave>=2&&r<.4?'fast':'thug',t=T[k],left=Math.random()<.5;
E.push({enemy:1,type:k,x:left?-40:W+40,y:R(FY0+10,FY1-10),base:t.b,s:t.b,hp:t.hp+(wave/6|0),max:t.hp+(wave/6|0),sp:t.sp*(1+wave*.04),dmg:t.dmg,skin:t.skin,shirt:t.shirt,pants:t.pants,hair:t.hair,style:t.style,face:left?1:-1,st:'walk',t:0,cd:R(.6,1.5),anim:Math.random()*9,flash:0,vx:0,atkT:0,rot:0,dir:1})}
const dsc=o=>o.s=o.base*(.82+(o.y-FY0)/(FY1-FY0)*.34);
function txt(x,y,t,col,sz,burst){FX.push({x,y,t,col,sz,burst,a:0,rot:R(0,6)})}
function spark(x,y,n,col,sp){for(let i=0;i<n;i++){const a=R(0,6.28),v=R(.4,1)*sp;PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,a:0,l:R(.3,.6),col})}}
function hit(e,pw){const dmg=pw==2?3:1,d=P.x<=e.x?1:-1;
e.hp-=dmg;e.flash=.12;combo++;comboT=1.6;e.atkT=0;
const sc=10*dmg*(1+(combo/5|0));score+=sc;
const ex=e.x,ey=e.y-70*e.s;
if(pw==2){txt(ex,ey,['POW!','BAM!','WHAM!','CRASH!'][Math.random()*4|0],'#ff5a1f',34,1);shake=11;spark(ex,ey,14,'#ffd23f',320)}
else{txt(ex,ey,['POF!','TAP!','PAF!'][Math.random()*3|0],'#fff',22);spark(ex,ey,6,'#fff',180)}
const heavy=e.type=='brute'?.5:1;
if(e.hp<=0){e.st='dead';e.t=0;e.dir=d;e.vx=d*(pw==2?380:220);score+=50;
if(Math.random()<(P.hp<30?.12:.025))IT.push({x:e.x,y:e.y});}
else{e.st='stun';e.t=pw==2?.75:.35;e.vx=d*(pw==2?280:90)*heavy}}
function attack(e){P.face=e.x>=P.x?1:-1;const s=P.pw==2;P.atk={t:0,d:s?.34:.24,type:s?'kick':'punch'};P.cd=s?.5:.3;hit(e,P.pw)}
function hurtP(d,from){P.hp-=d;P.inv=.6;P.hurt=.35;P.flash=.15;P.vx=(P.x<from?-1:1)*160;combo=0;shake=10;P.atk=null;txt(P.x,P.y-120,'ÚI!','#ff4a3d',26);
if(P.hp<=0){P.hp=0;mode='over';lockUntil=performance.now()+900;if(score>best){best=score;try{localStorage.setItem('bdz',best)}catch(_){}}}}
function update(dt){
const p=P;p.anim+=dt;p.cd-=dt;p.inv-=dt;p.flash-=dt;p.hurt-=dt;comboT-=dt;if(comboT<=0)combo=0;
ptr.sp*=Math.exp(-dt*6);shake*=Math.exp(-dt*12);
p.x+=p.vx*dt;p.vx*=Math.exp(-dt*8);p.moving=false;dsc(p);
if(p.atk){p.atk.t+=dt;if(p.atk.t>=p.atk.d)p.atk=null}
if(p.hurt<=0&&ptr.down){
let tgt=null,bd=1e9;
for(const e of E){if(e.st=='dead')continue;const dx=Math.abs(ptr.x-e.x);if(dx<36*e.s&&ptr.y<e.y+14&&ptr.y>e.y-128*e.s&&dx<bd){bd=dx;tgt=e}}
if(tgt!==p.tgt){p.pw=0;p.tgt=tgt}
if(tgt){p.pw=Math.max(p.pw,ptr.sp>650?2:1);
const side=Math.sign(p.x-tgt.x)||1,gx=tgt.x+side*50,gy=tgt.y,dx=gx-p.x,dy=gy-p.y,d=Math.hypot(dx,dy);
if(Math.abs(p.x-tgt.x)<72&&Math.abs(p.y-tgt.y)<26){if(p.cd<=0&&!p.atk)attack(tgt)}
else if(d>3){const m=Math.min(d,640*dt);p.x+=dx/d*m;p.y+=dy/d*m;p.moving=true;p.face=Math.sign(tgt.x-p.x)||p.face}}
else{const gy=clamp(ptr.y,FY0,FY1),dx=ptr.x-p.x,dy=gy-p.y,d=Math.hypot(dx,dy);
if(d>6){const m=Math.min(d,330*dt);p.x+=dx/d*m;p.y+=dy/d*m;p.moving=true;if(Math.abs(dx)>4)p.face=Math.sign(dx)}}
}else p.tgt=null;
p.x=clamp(p.x,22,W-22);p.y=clamp(p.y,FY0,FY1);
for(let i=IT.length-1;i>=0;i--){const it=IT[i];if(Math.hypot(it.x-p.x,it.y-p.y)<40){p.hp=Math.min(p.max,p.hp+20);txt(p.x,p.y-130,'+VIDA','#7dff7d',24);IT.splice(i,1)}}
for(const e of E){
e.anim+=dt;e.flash-=dt;e.atkT-=dt;e.x+=e.vx*dt;e.vx*=Math.exp(-dt*7);dsc(e);
if(e.st=='dead'){e.t+=dt;e.rot+=dt*12*e.dir;e.alpha=Math.max(0,1-e.t/.9);if(e.t>.9)e.del=1;continue}
e.moving=false;
if(e.st=='stun'){e.t-=dt;if(e.t<=0)e.st='walk';continue}
if(e.st=='wind'){e.t-=dt;if(e.t<=0){e.st='walk';e.atkT=.25;if(Math.abs(p.x-e.x)<88&&Math.abs(p.y-e.y)<30&&p.inv<=0)hurtP(e.dmg,e.x)}continue}
e.face=P.x>e.x?1:-1;e.cd-=dt;
const side=Math.sign(e.x-p.x)||1,gx=p.x+side*48,dx=gx-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy);
if(d>4){const m=Math.min(d,e.sp*dt);e.x+=dx/d*m;e.y+=dy/d*m;e.moving=true}
e.y=clamp(e.y,FY0,FY1);
if(Math.abs(p.x-e.x)<75&&Math.abs(p.y-e.y)<24&&e.cd<=0){e.st='wind';e.t=e.type=='fast'?.28:.4;e.cd=R(.8,1.6)}}
for(let i=0;i<E.length;i++)for(let j=i+1;j<E.length;j++){const a=E[i],b=E[j];if(a.st!='dead'&&b.st!='dead'&&Math.abs(a.x-b.x)<36&&Math.abs(a.y-b.y)<14){const s=a.y<b.y?-1:1;a.y+=s*30*dt;b.y-=s*30*dt}}
E=E.filter(e=>!e.del);
if(banner>0)banner-=dt;
else if(spawned<toSpawn){spawnT-=dt;if(spawnT<=0&&E.filter(e=>e.st!='dead').length<5+Math.min(wave,5)){spawn();spawned++;spawnT=R(.8,1.6)}}
else if(E.length==0)nextWave();
}
function fxStep(dt){for(const f of FX)f.a+=dt;FX=FX.filter(f=>f.a<.8);
for(const q of PT){q.a+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt}PT=PT.filter(q=>q.a<q.l)}
// ---------- render
function bigText(t,x,y,sz,fill,sc){ctx.save();ctx.translate(x,y);ctx.scale(sc||1,sc||1);ctx.font='bold '+sz+'px '+FONT;ctx.textAlign='center';ctx.lineWidth=sz/5;ctx.strokeStyle='#1a1018';ctx.lineJoin='round';ctx.strokeText(t,0,0);ctx.fillStyle=fill;ctx.fillText(t,0,0);ctx.restore()}
function draw(){
ctx.setTransform(2,0,0,2,0,0);ctx.drawImage(bg,0,0,W,H);
if(shake>.5)ctx.translate(R(-shake,shake),R(-shake,shake));
ctx.font='28px sans-serif';ctx.textAlign='center';for(const it of IT)ctx.fillText('🍗',it.x,it.y);
if(P){P.hu=P.hurt>0;P.at=P.atk?P.atk.type:null;P.ap=P.atk?P.atk.t/P.atk.d:0;P.alpha=P.inv>0&&((P.inv*20|0)%2)&&mode=='play'?.45:1;
const all=[P,...E];for(const e of E){e.hu=e.st=='stun'||e.st=='dead';e.wind=e.st=='wind';e.at=e.atkT>0?'punch':null;e.ap=1-e.atkT/.25}
all.sort((a,b)=>a.y-b.y).forEach(drawChar)}
for(const f of FX){const sc=1+.6*Math.max(0,1-f.a*8),y=f.y-f.a*50;
if(f.burst){ctx.save();ctx.translate(f.x,y-8);ctx.rotate(f.rot);ctx.beginPath();for(let i=0;i<16;i++){const r=(i%2?34:58)*sc,a=i/16*6.283;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fillStyle='#ffd23f';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle='#1a1018';ctx.stroke();ctx.restore()}
ctx.globalAlpha=Math.min(1,(.8-f.a)*4);bigText(f.t,f.x,y,f.sz,f.col,sc);ctx.globalAlpha=1}
for(const q of PT){ctx.globalAlpha=1-q.a/q.l;ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,3.5,0,7);ctx.fill()}ctx.globalAlpha=1;
ctx.setTransform(2,0,0,2,0,0);
if(mode=='play'&&ptr.down){ctx.beginPath();ctx.arc(ptr.x,ptr.y,24,0,7);ctx.lineWidth=4;ctx.strokeStyle=ptr.sp>650?'#ff5a1f':'rgba(255,255,255,.7)';ctx.stroke()}
if(P&&mode!='menu'){
ctx.fillStyle='#1a1018';ctx.beginPath();ctx.roundRect(10,12,170,24,12);ctx.fill();
ctx.fillStyle=P.hp>35?'#4cd964':'#ff4a3d';ctx.beginPath();ctx.roundRect(14,16,162*P.hp/P.max,16,8);ctx.fill();
ctx.font='18px sans-serif';ctx.textAlign='left';ctx.fillText('❤️',186,32);
bigText('ONDA '+wave,W/2+50,34,20,'#fff');ctx.textAlign='right';bigText(''+score,W-14,34,24,'#ffd23f');
if(combo>=2)bigText('COMBO x'+combo,W/2,70,22,'#ff9a3d');
if(banner>0&&mode=='play')bigText('ONDA '+wave,W/2,300,54,'#ffd23f',1+Math.max(0,banner-1.6)*1.5)}
if(mode!='play'){ctx.fillStyle='rgba(10,5,15,.6)';ctx.fillRect(0,0,W,H);
const bl=.5+.5*Math.sin(performance.now()/300);
if(mode=='menu'){bigText('BRIGA',W/2,250,64,'#ffd23f');bigText('DE BAR',W/2,320,64,'#ff6ec0');
['Arraste o dedo para mover','Passe o dedo sobre um inimigo para bater','Arrastou rápido = golpe forte!'].forEach((t,i)=>bigText(t,W/2,420+i*34,19,'#fff'));
if(best)bigText('Recorde: '+best,W/2,560,22,'#7dff7d')}
else{bigText('NOCAUTEADO!',W/2,290,48,'#ff4a3d');bigText('Pontos: '+score,W/2,370,30,'#fff');bigText('Onda: '+wave,W/2,410,26,'#ffd23f');bigText('Recorde: '+best,W/2,450,24,'#7dff7d')}
ctx.globalAlpha=.4+.6*bl;bigText(mode=='menu'?'Toque para começar':'Toque para jogar de novo',W/2,640,26,'#fff');ctx.globalAlpha=1}
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
if(mode=='play')update(dt);else if(P){P.anim+=dt;for(const e of E){e.anim+=dt}}
fxStep(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
